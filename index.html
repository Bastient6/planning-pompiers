<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planning Gardes 2026</title>
<link rel="manifest" href="manifest.json">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --purple: #534AB7;
  --purple-light: #EEEDFE;
  --purple-border: #AFA9EC;
  --green-light: #EAF3DE;
  --green-dark: #27500A;
  --amber-light: #FAEEDA;
  --amber-dark: #633806;
  --coral-light: #FAECE7;
  --coral-dark: #712B13;
  --blue-light: #E6F1FB;
  --blue-dark: #0C447C;
  --red: #E24B4A;
  --teal: #1D9E75;
  --border: rgba(0,0,0,0.12);
  --bg: #F5F4F0;
  --surface: #fff;
  --text: #1a1a1a;
  --text-muted: #666;
  --radius: 10px;
  --radius-sm: 6px;
  --sidebar-w: 220px;
}
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; min-height: 100vh; }

/* ── Auth ─────────────────────────────────────────── */
#auth-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 24px; padding: 24px; }
.auth-card { background: var(--surface); border-radius: 16px; padding: 32px; max-width: 400px; width: 100%; text-align: center; border: 0.5px solid var(--border); box-shadow: 0 4px 24px rgba(0,0,0,0.07); }
.auth-logo { font-size: 40px; margin-bottom: 14px; }
.auth-title { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
.auth-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 28px; line-height: 1.5; }
.btn-google { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 13px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); cursor: pointer; font-size: 14px; font-weight: 500; transition: background 0.15s, box-shadow 0.15s; }
.btn-google:hover { background: #f8f8f8; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.btn-google svg { width: 20px; height: 20px; flex-shrink: 0; }

/* ── App shell — MOBILE first ─────────────────────── */
#app { display: none; flex-direction: column; min-height: 100vh; }
#app.visible { display: flex; }

/* Topbar */
.topbar { background: var(--surface); border-bottom: 0.5px solid var(--border); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
.topbar-title { font-size: 15px; font-weight: 600; }
.user-chip { display: flex; align-items: center; gap: 8px; }
.avatar { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; }
.avatar-initials { width: 32px; height: 32px; border-radius: 50%; background: var(--purple-light); color: var(--purple); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.btn-logout { font-size: 12px; color: var(--text-muted); background: none; border: none; cursor: pointer; padding: 4px 8px; border-radius: var(--radius-sm); transition: background 0.15s; }
.btn-logout:hover { background: #f0f0f0; }

/* Main body */
.app-body { display: flex; flex: 1; overflow: hidden; }

/* Sidebar — masquée sur mobile */
.sidebar { display: none; }

/* Content */
.content { flex: 1; padding: 16px; overflow-y: auto; }

/* Bottom nav — visible sur mobile uniquement */
.bottom-nav { background: var(--surface); border-top: 0.5px solid var(--border); display: grid; grid-template-columns: repeat(4, 1fr); position: sticky; bottom: 0; z-index: 40; }
.nav-btn { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 4px; border: none; background: none; cursor: pointer; color: var(--text-muted); font-size: 10px; font-weight: 500; transition: color 0.15s; }
.nav-btn svg { width: 22px; height: 22px; }
.nav-btn.active { color: var(--purple); }

/* ── Desktop layout (≥ 768px) ─────────────────────── */
@media (min-width: 768px) {
  .topbar { padding: 14px 24px; }
  .topbar-title { font-size: 16px; }

  .app-body { height: calc(100vh - 57px); }

  /* Sidebar latérale */
  .sidebar {
    display: flex;
    flex-direction: column;
    width: var(--sidebar-w);
    background: var(--surface);
    border-right: 0.5px solid var(--border);
    padding: 20px 12px;
    gap: 4px;
    flex-shrink: 0;
    position: sticky;
    top: 57px;
    height: calc(100vh - 57px);
    overflow-y: auto;
  }
  .sidebar-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--text-muted);
    padding: 4px 12px 8px;
    margin-top: 4px;
  }
  .sidebar .nav-btn {
    flex-direction: row;
    justify-content: flex-start;
    gap: 10px;
    padding: 9px 12px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 500;
    width: 100%;
    text-align: left;
  }
  .sidebar .nav-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
  .sidebar .nav-btn.active { background: var(--purple-light); color: var(--purple); }
  .sidebar .nav-btn:hover:not(.active) { background: #f4f4f4; color: var(--text); }

  /* Cacher bottom-nav sur desktop */
  .bottom-nav { display: none; }

  /* Content centré avec max-width */
  .content { padding: 24px; max-width: 860px; }

  /* Saving indicator au-dessus du bas */
  .saving-indicator { bottom: 20px; }

  /* Modal centrée sur desktop */
  .modal-bg { align-items: center; }
  .modal { border-radius: 16px; max-width: 520px; }
  .modal-handle { display: none; }

  /* Cards en grille sur desktop */
  .desktop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .desktop-grid .card { margin-bottom: 0; }

  /* Stats row plus large */
  .stats-row { grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .stat-val { font-size: 28px; }

  /* Week table plus aérée */
  .week-table th, .week-table td { padding: 8px 12px; }
  .week-table { font-size: 12px; }
  .week-table td:first-child { min-width: 120px; font-size: 13px; }

  /* Agent row */
  .agent-row { padding: 9px 6px; }
  .agent-name { font-size: 14px; }

  /* Dispo row */
  .dispo-row { padding: 12px 4px; }
  .dispo-day { width: 110px; font-size: 14px; }

  /* Day nav */
  .day-nav button { padding: 8px 18px; font-size: 18px; }
  .day-nav .day-label { font-size: 16px; }

  /* Type grid sur desktop : 4 colonnes */
  .type-grid { grid-template-columns: repeat(4, 1fr); }
}

/* ── Cards ────────────────────────────────────────── */
.card { background: var(--surface); border-radius: var(--radius); border: 0.5px solid var(--border); padding: 14px; margin-bottom: 12px; }
.card-title { font-size: 12px; font-weight: 700; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); }

/* Equipe badges */
.eq-badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 20px; }
.eq-E1 { background: var(--amber-light); color: var(--amber-dark); }
.eq-E2 { background: var(--purple-light); color: #3C3489; }
.eq-E3 { background: var(--green-light); color: var(--green-dark); }
.eq-E4 { background: var(--coral-light); color: var(--coral-dark); }

/* Agent row */
.agent-row { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; padding: 7px 4px; border-bottom: 0.5px solid var(--border); }
.agent-row:last-child { border-bottom: none; }
.agent-name { font-size: 13px; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.badge-sm { font-size: 10px; padding: 1px 6px; border-radius: 20px; }
.soff { background: var(--blue-light); color: var(--blue-dark); }
.cond { background: var(--green-light); color: var(--green-dark); }

/* Equity bar */
.eq-bar-wrap { display: flex; align-items: center; gap: 6px; }
.eq-bar { width: 60px; height: 5px; border-radius: 3px; background: #eee; overflow: hidden; }
.eq-fill { height: 100%; border-radius: 3px; }
.fill-low { background: var(--teal); }
.fill-mid { background: #EF9F27; }
.fill-high { background: var(--red); }
.eq-pct { font-size: 11px; color: var(--text-muted); min-width: 28px; }

/* Affect button */
.btn-affect { font-size: 11px; padding: 4px 10px; border: 0.5px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; background: #f5f5f5; white-space: nowrap; transition: all 0.15s; }
.btn-affect:hover { background: var(--purple-light); border-color: var(--purple-border); color: var(--purple); }
.btn-done { font-size: 11px; padding: 4px 10px; border-radius: var(--radius-sm); background: var(--green-light); color: var(--green-dark); font-weight: 600; }

/* Day nav */
.day-nav { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
.day-nav button { border: 0.5px solid var(--border); background: var(--surface); border-radius: var(--radius-sm); padding: 6px 12px; cursor: pointer; font-size: 16px; transition: background 0.15s; }
.day-nav button:hover:not(:disabled) { background: var(--purple-light); border-color: var(--purple-border); }
.day-nav .day-label { flex: 1; text-align: center; font-weight: 600; font-size: 14px; }

/* Modal */
.modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; align-items: flex-end; justify-content: center; }
.modal-bg.open { display: flex; }
.modal { background: var(--surface); border-radius: 16px 16px 0 0; padding: 24px; width: 100%; max-width: 480px; }
.modal-handle { width: 36px; height: 4px; background: #ddd; border-radius: 2px; margin: 0 auto 16px; }
.modal-title { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
.modal-sub { font-size: 12px; color: var(--text-muted); margin-bottom: 18px; }
.type-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; }
.type-btn { padding: 10px; border: 0.5px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; font-size: 13px; font-weight: 500; background: #f9f9f9; text-align: center; transition: all 0.15s; }
.type-btn:hover { background: var(--purple-light); border-color: var(--purple-border); color: var(--purple); }
.type-btn.sel { background: var(--purple-light); border-color: var(--purple-border); color: var(--purple); }
.btn-confirm { width: 100%; padding: 13px; background: var(--purple); color: #fff; border: none; border-radius: var(--radius); font-size: 15px; font-weight: 600; cursor: pointer; transition: opacity 0.15s; }
.btn-confirm:hover:not(:disabled) { opacity: 0.9; }
.btn-confirm:disabled { background: #ccc; cursor: default; }
.btn-cancel { width: 100%; padding: 10px; background: none; border: none; color: var(--text-muted); font-size: 14px; cursor: pointer; margin-top: 8px; }

/* Week table */
.week-scroll { overflow-x: auto; }
.week-table { border-collapse: collapse; min-width: 100%; font-size: 11px; }
.week-table th, .week-table td { padding: 6px 8px; border: 0.5px solid var(--border); text-align: center; }
.week-table th { background: #f9f9f9; font-size: 10px; font-weight: 600; }
.week-table td:first-child { text-align: left; font-size: 12px; min-width: 90px; }
.cell-j { background: var(--green-light); color: var(--green-dark); border-radius: 3px; padding: 1px 4px; }
.cell-m { background: var(--blue-light); color: var(--blue-dark); border-radius: 3px; padding: 1px 4px; }
.cell-am { background: var(--amber-light); color: var(--amber-dark); border-radius: 3px; padding: 1px 4px; }
.cell-af { color: var(--purple); font-weight: 600; }

/* Dispo form */
.dispo-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 0.5px solid var(--border); }
.dispo-row:last-child { border-bottom: none; }
.dispo-day { width: 80px; font-size: 13px; }
.dispo-select { flex: 1; padding: 7px 10px; border: 0.5px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); font-size: 13px; }
.dispo-affect { font-size: 11px; color: var(--purple); font-weight: 600; }

/* Stats */
.stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.stat-box { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-sm); padding: 12px; text-align: center; }
.stat-val { font-size: 22px; font-weight: 700; }
.stat-lbl { font-size: 10px; color: var(--text-muted); margin-top: 2px; }

/* Loading / error */
.loader { text-align: center; padding: 40px; color: var(--text-muted); }
.error-msg { background: #fff0f0; border: 0.5px solid #fcc; border-radius: var(--radius-sm); padding: 12px; font-size: 13px; color: #c00; margin-bottom: 10px; }
.saving-indicator { position: fixed; bottom: 76px; right: 16px; background: var(--purple); color: #fff; font-size: 12px; padding: 6px 14px; border-radius: 20px; z-index: 100; display: none; box-shadow: 0 2px 8px rgba(83,74,183,0.3); }
.saving-indicator.visible { display: block; }

/* ── Week picker (nav semaine partagée) ──────────────────── */
.week-picker-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.week-picker-nav button { border: 0.5px solid var(--border); background: var(--surface); border-radius: var(--radius-sm); padding: 6px 14px; cursor: pointer; font-size: 17px; transition: background 0.15s; color: var(--text); }
.week-picker-nav button:hover:not(:disabled) { background: var(--purple-light); border-color: var(--purple-border); }
.week-picker-nav button:disabled { opacity: 0.3; cursor: default; }
.week-picker-label { flex: 1; text-align: center; font-weight: 600; font-size: 13px; color: var(--text-muted); }

/* Mini calendrier semaine (planning) */
.week-picker { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 14px; }
.week-day-btn { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; border: 0.5px solid transparent; border-radius: var(--radius-sm); cursor: pointer; background: var(--surface); transition: all 0.15s; }
.week-day-btn:hover { background: var(--purple-light); border-color: var(--purple-border); }
.week-day-btn.sel { background: var(--purple); border-color: var(--purple); }
.week-day-btn.today .wd-num { color: var(--purple); font-weight: 800; }
.week-day-btn.sel .wd-name,
.week-day-btn.sel .wd-num { color: #fff; }
.wd-name { font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; color: var(--text-muted); }
.week-day-btn.sel .wd-name { color: rgba(255,255,255,0.8); }
.wd-num { font-size: 14px; font-weight: 600; color: var(--text); line-height: 1; }
.wd-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--purple); }
.wd-dot-empty { background: transparent; }
.week-day-btn.sel .wd-dot { background: rgba(255,255,255,0.6); }

/* En-tête jour sélectionné */
.day-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; padding: 4px 2px; }

/* Dispo row améliorée */
.dispo-row-today { background: var(--purple-light); border-radius: var(--radius-sm); padding-left: 8px; padding-right: 8px; margin: 0 -8px; }
.dispo-day { display: flex; flex-direction: column; gap: 2px; min-width: 90px; }
.dispo-day-name { font-size: 12px; font-weight: 500; }

/* ── Dark mode ───────────────────────────────────────────── */
:root.dark {
  --bg:           #0f1117;
  --surface:      #1a1d27;
  --text:         #e8e9f0;
  --text-muted:   #7c7f94;
  --border:       rgba(255,255,255,0.10);
  --purple-light: #1e1b3a;
  --purple-border:#4a42a0;
  --green-light:  #0f2a14;
  --green-dark:   #6dba5a;
  --amber-light:  #2a1f0a;
  --amber-dark:   #d4933a;
  --coral-light:  #2a120a;
  --coral-dark:   #e07a60;
  --blue-light:   #0a1a2e;
  --blue-dark:    #5baae8;
}
:root.dark .week-table th { background: #23273a; }
:root.dark .type-btn { background: #23273a; color: var(--text); }
:root.dark .btn-google { background: #1a1d27; color: var(--text); }
:root.dark .btn-google:hover { background: #23273a; }
:root.dark .dispo-select { background: #23273a; color: var(--text); }
:root.dark .auth-card { background: #1a1d27; }
</style>
</head>
<body>

<!-- Auth screen -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">🚒</div>
    <div class="auth-title">Planning Gardes 2026</div>
    <div class="auth-sub">Connecte-toi avec ton compte Google pour accéder au planning</div>
    <button class="btn-google" id="btn-signin">
      <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
      Se connecter avec Google
    </button>
  </div>
</div>

<!-- Main app -->
<div id="app">
  <div class="topbar">
    <div class="topbar-title">🚒 Planning 2026</div>
    <div class="user-chip">
      <button id="btn-dark" onclick="toggleDarkMode()" style="font-size:16px;background:none;border:none;cursor:pointer;padding:4px 6px;border-radius:var(--radius-sm)" title="Thème sombre">🌙</button>
      <span class="avatar-initials" id="user-initials"></span>
      <span style="font-size:13px;font-weight:500" id="user-name-short"></span>
      <button class="btn-logout" onclick="signOut()">↩</button>
    </div>
  </div>

  <div class="app-body">
    <!-- Sidebar desktop -->
    <nav class="sidebar">
      <div class="sidebar-label">Navigation</div>
      <button class="nav-btn active" onclick="showTab('planning', this)">
        <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        Planning
      </button>
      <button class="nav-btn" onclick="showTab('semaine', this)">
        <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Semaine
      </button>
      <button class="nav-btn" onclick="showTab('equite', this)">
        <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
        Équité
      </button>
      <button class="nav-btn" onclick="showTab('dispos', this)">
        <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Mes dispos
      </button>
    </nav>

    <div class="content" id="content">
      <div class="loader">Chargement...</div>
    </div>
  </div>

  <!-- Bottom nav mobile -->
  <nav class="bottom-nav">
    <button class="nav-btn active" onclick="showTab('planning', this)">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      Planning
    </button>
    <button class="nav-btn" onclick="showTab('semaine', this)">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      Semaine
    </button>
    <button class="nav-btn" onclick="showTab('equite', this)">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
      Équité
    </button>
    <button class="nav-btn" onclick="showTab('dispos', this)">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Mes dispos
    </button>
  </nav>
</div>

<!-- Affect modal -->
<div class="modal-bg" id="modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="m-title">Affecter</div>
    <div class="modal-sub" id="m-sub"></div>
    <div class="type-grid" id="m-types"></div>
    <button class="btn-confirm" id="m-confirm" onclick="confirmAffect()" disabled>Confirmer</button>
    <button class="btn-cancel" onclick="closeModal()">Annuler</button>
  </div>
</div>

<div class="saving-indicator" id="saving">Enregistrement...</div>

<script src="config.js"></script>
<script src="auth.js"></script>
<script src="sheets.js"></script>
<script src="app.js"></script>
</body>
</html>
